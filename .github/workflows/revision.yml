# Revisión automática en cada push y pull request: pruebas, tipos, dependencias y secretos.
name: Revision

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Busqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # revisa todo el historial, no solo el ultimo commit
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --exit-code 1
      - name: Archivos que nunca deben subirse
        run: |
          if git ls-files | grep -E -i '(^|/)\.env$|(^|/)\.env\.local$|worker/(entrada|tmp)/|\.pem$|\.key$'; then
            echo "::error::Hay archivos sensibles con seguimiento en git"; exit 1
          fi

  panel:
    name: Panel y bot (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Genera los tipos de rutas de Next (PageProps, LayoutProps); no se guardan en git.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"
      - name: Dependencias de produccion sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  worker:
    name: Worker de OCR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt pip-audit==2.9.0
      - run: python -m pytest -q
      - name: Dependencias sin vulnerabilidades conocidas
        run: pip-audit -r requirements.txt
